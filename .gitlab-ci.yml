variables:
  MIRAI_DEPLOY_PATH: /mnt/user/appdata/mirai-automations
  MIRAI_DEPLOY_REPO: tabgroup/mirai-automations

deploy:
  stage: deploy
  tags:
    - shell
  script:
    - |
      clean_remote="http://${MIRAI_DEPLOY_HOST}/${MIRAI_DEPLOY_REPO}.git"
      authenticated_remote="http://gitlab-ci-token:${CI_JOB_TOKEN}@"
      authenticated_remote="${authenticated_remote}${MIRAI_DEPLOY_HOST}/"
      authenticated_remote="${authenticated_remote}${MIRAI_DEPLOY_REPO}.git"

      git -c safe.directory="${MIRAI_DEPLOY_PATH}" \
        -C "${MIRAI_DEPLOY_PATH}" \
        remote set-url origin "${clean_remote}"
      git -c safe.directory="${MIRAI_DEPLOY_PATH}" \
        -C "${MIRAI_DEPLOY_PATH}" \
        fetch --prune "${authenticated_remote}" \
        "+refs/heads/main:refs/remotes/origin/main"
      git -c safe.directory="${MIRAI_DEPLOY_PATH}" \
        -C "${MIRAI_DEPLOY_PATH}" \
        checkout -B main refs/remotes/origin/main

      deployment_metadata="${MIRAI_DEPLOY_PATH}/automations/.mirai-deployment.json"
      deployment_metadata_tmp="${deployment_metadata}.${CI_JOB_ID}.tmp"

      printf \
        '{"branch":"%s","commit":"%s"}\n' \
        "${CI_COMMIT_BRANCH}" \
        "${CI_COMMIT_SHA}" \
        > "${deployment_metadata_tmp}"
      mv --force "${deployment_metadata_tmp}" "${deployment_metadata}"
    - |
      curl \
        --fail-with-body \
        --silent \
        --show-error \
        --unix-socket /var/run/docker.sock \
        --request POST \
        "http://localhost/containers/mirai/restart?t=5"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
